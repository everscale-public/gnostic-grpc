openapi: 3.0.0
info:
  title: Service With Common Types
  version: "1.0.0"
paths:
  /resources:
    get:
      operationId: listResources
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
    post:
      operationId: createResource
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Resource'
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
components:
  schemas:
    Resource:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        labels:
          type: array
          items:
            $ref: './common.yaml#/components/schemas/Label'
